<style>
/* Layout: one-screen phone app. Each screen = sticky header + scrolling body + (tab bar | one primary action). Hierarchy: one filled button per screen, secondary = outlined, tertiary = text link. */
:root{
  /* all text/background pairs below measure ≥ 4.5:1 (WCAG AA) in both themes */
  --bg:#F3F5F4; --surface:#FFFFFF; --surface2:#EAF0ED; --fg:#17221F; --muted:#5B6A66; --line:#DCE3E0;

  --t-enter:200ms cubic-bezier(.2,.8,.2,1); --t-exit:140ms cubic-bezier(.4,0,1,1); --t-press:120ms ease-out;
  /* type scale 12 / 14 / 16 / 18 / 24 / 32 / 48 */

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --accent:#4FB79F; --accent-soft:#1D3A33; --accent-fg:#0F1614; --gold:#E0B25C; --gold-soft:#3A2F17;
  --ok:#5CCB8F; --ok-soft:#173627; --warn:#E2A04D; --warn-soft:#3A2A12; --bad:#EF8075; --bad-soft:#3D1F1C;

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs-md);line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation}

.screen{flex:1;min-height:0;display:flex;flex-direction:column}

.legend{display:flex;gap:16px;font-size:var(--fs-xs);color:var(--muted)}

function calendar(subDays,subLabel,extra){const days=[];const first=(new Date(2026,9,1).getDay()+6)%7;for(let i=0;i<first;i++)days.push('<div class="d pad"></div>');
 for(let d=1;d<=31;d++){const dow=new Date(2026,9,d).getDay();let cls='work',lab='在岗';if(dow===0){cls='rest';lab='休';}if(subDays.includes(d)){cls='sub';lab=subLabel;}if(extra&&extra.days.includes(d)){cls='sub';lab=extra.label;}if(d===11)cls+=' today';days.push(`<div class="d ${cls}"><span class="num">${d}</span><small>${lab}</small></div>`);}
 return `<div class="cal">${['一','二','三','四','五','六','日'].map(d=>`<div class="dow">${d}</div>`).join('')}${days.join('')}</div>`;}

  <div class="col" style="margin-top:12px;gap:9px">${[['在岗稳定',29,30],['雇主评价',24,25],['准时打卡',25,25],['无纠纷',20,20]].map(([k,v,m])=>`<div class="credit-row"><span class="small" style="width:64px">${k}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><b class="small num" style="width:40px;text-align:right">${v}/${m}</b></div>`).join('')}</div>
  <div class="xs muted" style="margin-top:10px">信用归您本人，换雇主、换平台都带得走</div></div>
 <div class="card" style="padding:6px 16px"><div class="list">
  <button class="li" data-act="enroll"><span class="grow">考核中心</span><span class="small muted">10/25 长期照护师实操 · 可报名</span><span class="chev">›</span></button>
  ${[['证书核验','2 已核验 · 1 待上传'],['合同','徐女士家 · 第 47 天'],['收入与报销','10 月 ¥9,800'],['保险','意外险 · 平台投保'],['我对雇主的评价','2 条']].map(([k,v])=>`<button class="li" data-act="soon"><span class="grow">${k}</span><span class="small muted">${v}</span><span class="chev">›</span></button>`).join('')}</div></div>
 <div class="demo-hint">示例数据 · 稳家 Demo</div>
</div>`+tabbar();}

/* ---------- render ---------- */
function render(){const v=document.getElementById('view');let html='';
 if(!S.role)html=vSplash();
 else if(S.stack.length){const t=S.stack[S.stack.length-1];html=({aunt:vAunt,post:vPost,chat:vChat,emp:vEmp})[t.view](t.params);}
 else if(S.role==='employer')html=({home:vEHome,find:vEFind,sched:vESched,msgs:vMsgs,me:vEMe})[S.tab]();
 else html=({home:vAHome,find:vAFind,sched:vASched,msgs:vMsgs,me:vAMe})[S.tab]();
 v.innerHTML=html;v.className='screen'+(anim?' anim-'+anim:'');anim='';
 const b=v.querySelector('.body');if(b)b.scrollTop=scrollMemo[curKey()]||0;}

document.getElementById('app').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
 switch(a){
  case 'role':S.role=el.dataset.role;S.tab='home';S.stack=[];anim='fade';render();break;
  case 'switch':S.role=S.role==='employer'?'aunt':'employer';S.tab='home';S.stack=[];S.filter='全部';S.msgsSeen=false;anim='fade';render();toast(S.role==='employer'?'已切换到雇主端':'已切换到阿姨端');break;
  case 'tab':setTab(el.dataset.tab);break;
  case 'back':back();break;
  case 'filter':S.filter=el.dataset.f;render();break;
  case 'find-cat':S.filter=el.dataset.cat;setTab('find');break;
  case 'aunt':go('aunt',{id:el.dataset.id});break;
  case 'emp':go('emp',{id:el.dataset.id});break;
  case 'chat':go('chat',{id:el.dataset.id});break;
  case 'chat-c3':go('chat',{id:'c3'});break;
  case 'post':S.form.step=0;go('post');break;
  case 'opt':S.form[el.dataset.k]=el.dataset.v;if(el.dataset.k==='cat'){S.form.kid=CAT_Q[el.dataset.v][1][1];S.form.pay=PAY_REF[el.dataset.v][1][1];}render();break;
  case 'step':S.form.step+=Number(el.dataset.d);render();break;
  case 'submit':busy(el,700,()=>{back();toast('已发布，推送给 6 位匹配阿姨');});break;
  case 'invite':{const au=AUNTS.find(x=>x.id===el.dataset.id);sheet(`<h3>向${au.name}发起互选</h3><div class="small muted">阿姨会看到您的雇主信用、工作内容和薪资，24 小时内回应。</div><div class="card" style="box-shadow:none;background:var(--surface2)"><div class="kv"><span>需求</span><b>${({'育儿嫂':'育儿嫂 · 宝宝 8 个月 · 住家','养老照护':'养老照护 · 父亲 78 岁 · 白班','住家保洁':'住家保洁 · 三居室 · 三餐 + 保洁'})[au.cat]}</b></div><div class="kv"><span>月薪</span><b class="num">${({'育儿嫂':'¥9,500','养老照护':'¥7,800','住家保洁':'¥7,500'})[au.cat]}</b></div><div class="kv"><span>您的信用</span><b>782 · A 级</b></div></div><button class="btn" data-act="invite-ok" data-id="${au.id}">发送邀请</button>`);break;}
  case 'invite-ok':busy(el,600,()=>{S.invited[el.dataset.id]=true;closeSheet();render();toast('已发送，等待阿姨回应');});break;
  case 'apply':{const em=EMPLOYERS.find(x=>x.id===el.dataset.id);sheet(`<h3>${em.id==='e3'?'接受互选':'申请这份工作'}</h3><div class="small muted">雇主会看到您的考核档案、履约记录和信用分。${em.grade==='C'?'该雇主已预付 1 个月工资到平台，您的工资有保障。':''}</div><button class="btn" data-act="apply-ok" data-id="${em.id}">${em.id==='e3'?'接受并约面试':'确认申请'}</button>`);break;}
  case 'apply-ok':busy(el,600,()=>{S.applied[el.dataset.id]=true;closeSheet();render();toast('已提交，雇主 24 小时内回应');});break;
  case 'leave':sheet(`<h3>申请请假</h3><div class="field"><label>日期</label><div class="opts"><button class="on">10/24 周六 – 10/25 周日</button></div></div><div class="field"><label>原因（雇主可见）</label><input id="leave-why" value="家中有事"></div><div class="small muted">雇主同意后，平台自动安排替班，不扣工资。</div><button class="btn" data-act="leave-ok">提交申请</button>`);break;
  case 'leave-ok':busy(el,600,()=>{S.leave=true;closeSheet();render();toast('雇主已同意，正在匹配替班');});setTimeout(()=>{S.subOk=true;if(S.role==='aunt'&&S.tab==='sched'&&!S.stack.length)render();toast('替班已确认：周红（A 级）');},2600);break;
  case 'enroll':toast('已报名 10/25 长期照护师实操考核');break;
  case 'send':{const inp=document.getElementById('chat-in');if(inp&&inp.value.trim()){const b=document.querySelector('#view .body');b.insertAdjacentHTML('beforeend',`<div class="msg me"><div class="bub">${esc(inp.value)}</div></div>`);inp.value='';b.scrollTop=b.scrollHeight;}break;}
  case 'sheet-close':closeSheet();break;
  case 'soon':toast('Demo 中暂未实现');break;
 }});
render();
</script>
</body></html>
